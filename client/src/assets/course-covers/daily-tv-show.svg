<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6"/>
      <stop offset="100%" stop-color="#4361EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <rect width="400" height="240" fill="url(#glow)"/>
  <!-- 装饰图形 -->
  <g opacity="0.9">
    <g transform="translate(265,50)"><rect x="0" y="0" width="100" height="70" rx="6" fill="white" opacity="0.2"/><polygon points="45,20 45,50 70,35" fill="white" opacity="0.9"/></g>
  </g>
  <!-- 标题文字 -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="28" y="178" fill="white" font-size="20" font-weight="700">美剧英语口语</text>
    <text x="28" y="202" fill="white" font-size="13" opacity="0.85">看美剧学地道口语</text>
  </g>
  <!-- 底部装饰线 -->
  <line x1="28" y1="218" x2="80" y2="218" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
