<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <rect width="400" height="240" fill="url(#glow)"/>
  <!-- 装饰图形 -->
  <g opacity="0.9">
    <g transform="translate(290,50)"><circle cx="30" cy="30" r="25" fill="white" opacity="0.3"/><text x="20" y="38" font-size="22" fill="white">👶</text></g><text x="260" y="110" font-size="30" fill="white" opacity="0.6">ABC</text>
  </g>
  <!-- 标题文字 -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="28" y="178" fill="white" font-size="20" font-weight="700">少儿英语启蒙300句</text>
    <text x="28" y="202" fill="white" font-size="13" opacity="0.85">孩子的第一堂英语课</text>
  </g>
  <!-- 底部装饰线 -->
  <line x1="28" y1="218" x2="80" y2="218" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
