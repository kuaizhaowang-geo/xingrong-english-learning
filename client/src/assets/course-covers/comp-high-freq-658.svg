    <g transform="translate(275,55)"><rect x="5" y="10" width="55" height="40" rx="4" fill="white" opacity="0.2"/><rect x="12" y="18" width="40" height="4" rx="2" fill="white" opacity="0.7"/><rect x="12" y="28" width="30" height="3" rx="1.5" fill="white" opacity="0.5"/><rect x="12" y="36" width="35" height="3" rx="1.5" fill="white" opacity="0.5"/><rect x="12" y="44" width="20" height="3" rx="1.5" fill="white" opacity="0.3"/></g>
  </g>
  <!-- 标题文字 -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="28" y="178" fill="white" font-size="20" font-weight="700">高频词频通用英语658</text>
    <text x="28" y="202" fill="white" font-size="13" opacity="0.85">掌握核心词汇</text>
