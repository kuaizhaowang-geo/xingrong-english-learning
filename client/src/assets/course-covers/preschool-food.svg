<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <rect width="400" height="240" fill="url(#glow)"/>
  <!-- 装饰图形 -->
  <g opacity="0.9">
    <g transform="translate(280,55)"><circle cx="30" cy="30" r="22" fill="white" opacity="0.25"/><path d="M30 12 Q35 8 38 12" stroke="white" stroke-width="2" fill="none"/><ellipse cx="28" cy="28" rx="3" ry="5" fill="white" opacity="0.5"/><ellipse cx="38" cy="30" rx="2" ry="4" fill="white" opacity="0.3" transform="rotate(20 38 30)"/></g>
  </g>
  <!-- 标题文字 -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="28" y="178" fill="white" font-size="20" font-weight="700">主题词汇：食物与水果</text>
    <text x="28" y="202" fill="white" font-size="13" opacity="0.85">舌尖上的英语越吃越想学</text>
  </g>
  <!-- 底部装饰线 -->
  <line x1="28" y1="218" x2="80" y2="218" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
