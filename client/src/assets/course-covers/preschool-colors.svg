<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <rect width="400" height="240" fill="url(#glow)"/>
  <!-- 装饰图形 -->
  <g opacity="0.9">
    <g transform="translate(270,55)"><circle cx="15" cy="30" r="10" fill="white" opacity="0.4"/><rect x="30" y="20" width="20" height="20" rx="2" fill="white" opacity="0.3"/><polygon points="60,30 70,50 50,50" fill="white" opacity="0.35"/><text x="10" y="35" fill="white" font-size="10" font-weight="bold">1</text><text x="36" y="35" fill="white" font-size="10" font-weight="bold">2</text><text x="55" y="45" fill="white" font-size="10" font-weight="bold">3</text></g>
  </g>
  <!-- 标题文字 -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="28" y="178" fill="white" font-size="20" font-weight="700">主题词汇：颜色与数字</text>
    <text x="28" y="202" fill="white" font-size="13" opacity="0.85">七彩世界数来数去真有趣</text>
  </g>
  <!-- 底部装饰线 -->
  <line x1="28" y1="218" x2="80" y2="218" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
